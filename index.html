<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profe de Voz</title>
<meta name="theme-color" content="#f7f6f3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --line: #e8e6e1; --text: #2b2b2b; --muted: #8a8780;
    --accent: #4f7cac; --accent-soft: #e8eff6; --ok: #5a9e7c; --ok-soft: #e7f3ec;
    --warn: #c99a3b; --bad: #c0605a; --bad-soft: #f7e9e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.5; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 4px; padding: 10px 8px; position: sticky; top: 0;
    background: var(--bg); z-index: 5; padding-top: calc(10px + env(safe-area-inset-top)); }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 8px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 640px; margin: 0 auto; padding: 4px 16px 40px; }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 10px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 500; }
  button.soft { background: var(--accent-soft); color: var(--accent); }
  button.plain { background: transparent; color: var(--muted); padding: 10px 12px; }
  button.icon { background: transparent; color: var(--text); padding: 8px 12px; font-size: 20px; }
  button:disabled { opacity: .45; }
  button.block { width: 100%; }
  input, textarea, select { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; }
  input[type=range] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
  label { display: block; font-size: 15px; color: var(--muted); margin: 14px 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
  .tap { cursor: pointer; }
  .muted { color: var(--muted); font-size: 15px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .hidden { display: none !important; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--ok); border-radius: 3px; }
  .pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .stage-head { display: flex; gap: 12px; align-items: center; }
  .num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
  .done .num { background: var(--ok); color: #fff; }
  .current .num { background: var(--accent); color: #fff; }
  .locked { opacity: .5; }
  .modules { margin: 12px 0 0 42px; display: flex; flex-direction: column; gap: 2px; }
  .mod { padding: 8px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .mod:hover { background: var(--bg); }
  .mod .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; transform: translateY(-1px); }
  .mod.seen .dot { background: var(--ok); }
  .stage-actions { margin: 10px 0 0 42px; display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson { font-size: 18px; line-height: 1.65; white-space: pre-wrap; }
  .lesson-title { font-size: 24px; font-weight: 650; margin: 6px 0 4px; line-height: 1.25; }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; font-size: 16px; }
  .msg.ai { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .msg.me { background: var(--accent-soft); align-self: flex-end; }
  .score-big { font-size: 44px; font-weight: 700; line-height: 1; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .scores .card { margin: 0; text-align: center; }
  .exam-type { display: block; text-align: left; width: 100%; background: var(--card); color: var(--text);
    border: 1px solid var(--line); margin-bottom: 10px; padding: 14px 16px; }
  .exam-type b { display: block; }
  .exam-type span { color: var(--muted); font-size: 14px; font-weight: 400; }
  .err { color: var(--bad); }
  .loading { color: var(--muted); padding: 20px 0; text-align: center; }
  .speak-btn { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <button class="icon hidden" id="backBtn" aria-label="Volver">←</button>
  <h1 id="title">Profe de Voz</h1>
  <button class="icon" id="settingsBtn" aria-label="Configuración">⚙︎</button>
</header>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
