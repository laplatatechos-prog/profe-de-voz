<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profe de Voz</title>
<meta name="theme-color" content="#f7f6f3">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "onnxruntime-web/wasm": "./vendor/ort/ort.wasm.min.js" } }</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #fbf8f4; --card: #ffffff; --line: #ece7e0; --text: #2b2b2b; --muted: #7d7a74;
    --accent: #6c5ce7; --accent-soft: #eeebff; --ok: #2fb380; --ok-soft: #e2f6ee;
    --pink: #ff7aa2; --pink-soft: #ffeef3; --mint: #2fb380; --mint-soft: #e2f6ee; --sky: #3a9bff; --sky-soft: #e6f2ff;
    --lemon: #f2b705; --lemon-soft: #fff7d9; --lavender: #8e6cf0; --lavender-soft: #f1ecff; --peach: #ff8a4c; --peach-soft: #fff0e6;
    --warn: #c99a3b; --bad: #c0605a; --bad-soft: #f7e9e8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; line-height: 1.5; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 4px; padding: 10px 8px; position: sticky; top: 0;
    background: var(--bg); z-index: 5; padding-top: calc(10px + env(safe-area-inset-top)); }
  header h1 { font-size: 18px; font-weight: 600; margin: 0 8px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { max-width: 640px; margin: 0 auto; padding: 4px 16px 40px; }
  h2 { font-size: 15px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 10px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
    background: linear-gradient(135deg, #7b6cff, #4f9dff); color: #fff; font-weight: 600; }
  button.soft { background: var(--accent-soft); color: var(--accent); }
  button.plain { background: transparent; color: var(--muted); padding: 10px 12px; }
  button.icon { background: transparent; color: var(--text); padding: 8px 12px; font-size: 20px; }
  button:disabled { opacity: .45; }
  button.block { width: 100%; }
  input, textarea, select { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; }
  input[type=range] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
  label { display: block; font-size: 15px; color: var(--muted); margin: 14px 0 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 10px; }
  .tap { cursor: pointer; }
  .muted { color: var(--muted); font-size: 15px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .hidden { display: none !important; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; background: var(--ok); border-radius: 3px; }
  .pill { display: inline-block; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .stage-head { display: flex; gap: 12px; align-items: center; }
  .num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--line); font-size: 14px; font-weight: 600; color: var(--muted); }
  .done .num { background: var(--ok); color: #fff; }
  .current .num { background: var(--accent); color: #fff; }
  .locked { opacity: .5; }
  .modules { margin: 12px 0 0 42px; display: flex; flex-direction: column; gap: 2px; }
  .mod { padding: 8px 10px; border-radius: 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .mod:hover { background: var(--bg); }
  .mod .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; transform: translateY(-1px); }
  .mod.seen .dot { background: var(--ok); }
  .stage-actions { margin: 10px 0 0 42px; display: flex; gap: 8px; flex-wrap: wrap; }
  .lesson { font-size: 18px; line-height: 1.65; white-space: pre-wrap; }
  .lesson-title { font-size: 24px; font-weight: 650; margin: 6px 0 4px; line-height: 1.25; }
  .chat { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; font-size: 16px; }
  .msg.ai { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .msg.me { background: var(--accent-soft); align-self: flex-end; }
  .score-big { font-size: 44px; font-weight: 700; line-height: 1; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .scores .card { margin: 0; text-align: center; }
  .exam-type { display: block; text-align: left; width: 100%; background: var(--card); color: var(--text);
    border: 1px solid var(--line); margin-bottom: 10px; padding: 14px 16px; }
  .exam-type b { display: block; }
  .exam-type span { color: var(--muted); font-size: 14px; font-weight: 400; }
  .err { color: var(--bad); }
  .loading { color: var(--muted); padding: 20px 0; text-align: center; }
  .score-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .score-row { padding: 5px 0; font-size: 15px; }
  .result-screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; color: #fff; text-align: center;
    animation: pop .35s ease-out; }
  .result-screen.pass { background: #4f9a74; }
  .result-screen.fail { background: #d4874e; }
  @keyframes pop { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
  .result-inner { width: 100%; max-width: 420px; padding-bottom: 64px; }
  .result-topic { opacity: .85; font-size: 15px; }
  .result-label { font-size: 22px; margin-top: 18px; }
  .result-num { font-size: 104px; font-weight: 750; line-height: 1; margin: 8px 0 12px; }
  .result-msg { font-size: 18px; margin-top: 14px; }
  .result-sub { display: flex; justify-content: center; gap: 22px; margin: 18px 0 36px; opacity: .9; }
  .result-btn { background: #fff; color: #2b2b2b; margin-top: 10px; }
  .result-btn.ghost { background: rgba(255,255,255,.18); color: #fff; }
  .seg { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 12px; }
  .seg button { flex: 1; background: transparent; color: var(--muted); padding: 10px 6px; font-size: 15px; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  /* ---- Animaciones ---- */
  button, .card.tap, .mod, .exam-type { transition: transform .14s cubic-bezier(.3,1.6,.6,1), box-shadow .2s, background .2s; }
  button:active:not(:disabled), .exam-type:active { transform: scale(.93); }
  .card.tap:active, .mod:active { transform: scale(.97); }
  .card.tap:hover { box-shadow: 0 6px 18px rgba(0,0,0,.06); }
  button:not(.plain):not(.icon):not(.soft):not(.result-btn) { box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  button:not(.plain):not(.icon):active { box-shadow: none; }
  main.enter > * { animation: fadeUp .38s cubic-bezier(.2,.9,.3,1.2) both; }
  main.enter > *:nth-child(2) { animation-delay: .04s; } main.enter > *:nth-child(3) { animation-delay: .08s; }
  main.enter > *:nth-child(4) { animation-delay: .12s; } main.enter > *:nth-child(5) { animation-delay: .16s; }
  main.enter > *:nth-child(n+6) { animation-delay: .2s; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .emoji { display: inline-block; }
  .card.tap:active .emoji { animation: wiggle .4s; }
  @keyframes wiggle { 25% { transform: rotate(-15deg) scale(1.2); } 75% { transform: rotate(12deg) scale(1.2); } }
  .mod .dot { display: grid; place-items: center; font-size: 11px; width: 16px; height: 16px; }
  .mod.seen .dot { background: transparent; animation: pop .4s; }
  .result-emoji { font-size: 64px; margin-top: 10px; animation: bounceIn .7s .1s both; }
  .result-level { display: inline-block; margin-top: 8px; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 20px; font-weight: 700; animation: bounceIn .7s .2s both; }
  .result-joke { font-size: 17px; font-style: italic; margin: 12px auto 0; max-width: 340px; opacity: .95; animation: fadeUp .5s .4s both; }
  .result-num { animation: bounceIn .7s .25s both; }
  .result-msg, .result-sub, .result-btn { animation: fadeUp .5s .5s both; }
  @keyframes bounceIn { 0% { opacity: 0; transform: scale(.3); } 55% { opacity: 1; transform: scale(1.15); } 75% { transform: scale(.95); } 100% { transform: scale(1); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { top: 105%; transform: rotate(720deg) translateX(40px); } }
  .loading::after { content: ''; display: inline-block; width: 14px; height: 14px; margin-left: 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .voices { display: flex; flex-direction: column; gap: 8px; }
  .voice-btn { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--bg); color: var(--text); border: 2px solid transparent; padding: 12px 14px; }
  .voice-btn.on { background: var(--accent-soft); border-color: var(--accent); }
  .voice-ico { font-size: 28px; }
  .voice-txt { flex: 1; display: flex; flex-direction: column; }
  .voice-txt span { font-size: 14px; color: var(--muted); font-weight: 400; }
  .voice-btn { position: relative; overflow: hidden; }
  .dl-bar { position: absolute; left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, #2fb380, #3a9bff); transition: width .3s; }
  .voice-check { color: var(--accent); font-weight: 700; font-size: 20px; animation: pop .3s; }
  /* ---- Colores ---- */
  header h1 { background: linear-gradient(90deg, #6c5ce7, #ff7aa2, #ff8a4c); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
  .bar > div { background: linear-gradient(90deg, #2fb380, #3a9bff); }
  .tint-pink { background: var(--pink-soft); border-color: transparent; border-left: 6px solid var(--pink); }
  .tint-mint { background: var(--mint-soft); border-color: transparent; border-left: 6px solid var(--mint); }
  .tint-sky { background: var(--sky-soft); border-color: transparent; border-left: 6px solid var(--sky); }
  .tint-lemon { background: var(--lemon-soft); border-color: transparent; border-left: 6px solid var(--lemon); }
  .tint-lavender { background: var(--lavender-soft); border-color: transparent; border-left: 6px solid var(--lavender); }
  .tint-peach { background: var(--peach-soft); border-color: transparent; border-left: 6px solid var(--peach); }
  .stage-pink .num { background: var(--pink-soft); color: var(--pink); } .stage-mint .num { background: var(--mint-soft); color: var(--mint); }
  .stage-sky .num { background: var(--sky-soft); color: var(--sky); } .stage-lemon .num { background: var(--lemon-soft); color: #b58700; }
  .stage-lavender .num { background: var(--lavender-soft); color: var(--lavender); } .stage-peach .num { background: var(--peach-soft); color: var(--peach); }
  .current.stage-pink .num { background: var(--pink); color: #fff; } .current.stage-mint .num { background: var(--mint); color: #fff; }
  .current.stage-sky .num { background: var(--sky); color: #fff; } .current.stage-lemon .num { background: var(--lemon); color: #fff; }
  .current.stage-lavender .num { background: var(--lavender); color: #fff; } .current.stage-peach .num { background: var(--peach); color: #fff; }
  .card.done .num { background: var(--ok) !important; color: #fff !important; }
  .result-screen.pass { background: linear-gradient(160deg, #2fb380, #1f9e8f); }
  .result-screen.fail { background: linear-gradient(160deg, #ff8a4c, #ff6b6b); }
  .lesson-title { color: var(--accent); }
  .msg.me { background: linear-gradient(135deg, #eeebff, #e6f2ff); }
  #stopFab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40; border-radius: 999px;
    padding: 12px 18px; font-weight: 800; background: #d9d4cc; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.15); opacity: .55; }
  body.has-answer #stopFab { bottom: auto; top: calc(64px + env(safe-area-inset-top)); padding: 8px 14px; font-size: 14px; }
  #stopFab.on { background: linear-gradient(135deg, #ff6b6b, #ff8a4c); opacity: 1; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  button.danger { background: #ffecec; color: #d64545; box-shadow: none; }
  main { padding-bottom: 90px; }
  .msg.ai { position: relative; padding-right: 40px; white-space: normal; }
  .msg.ai > div { white-space: pre-wrap; }
  .msg .q { margin-top: 8px; font-weight: 700; color: var(--accent); }
  .msg .fb { margin-bottom: 6px; }
  .msg .say { position: absolute; top: 4px; right: 2px; padding: 6px 8px; font-size: 16px; }
  .mini-score { display: inline-block; font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 999px; margin-bottom: 6px; }
  .mini-score.ok { background: var(--ok-soft); color: var(--ok); } .mini-score.bad { background: #ffecec; color: #d64545; }
  .answer-row { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 12px; align-items: flex-end; margin-top: 10px; }
  .answer-row textarea { min-height: 52px; }
  .speak-btn { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <button class="icon hidden" id="backBtn" aria-label="Volver">←</button>
  <h1 id="title">Profe de Voz</h1>
  <button class="icon" id="settingsBtn" aria-label="Configuración">⚙︎</button>
</header>
<main id="app"></main>
<button id="stopFab" aria-label="Parar la voz">■ Parar voz</button>
<script src="app.js"></script>
</body>
</html>
